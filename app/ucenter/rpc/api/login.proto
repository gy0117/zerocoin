syntax = "proto3";

package login;

// protoc-gen-go 版本大于1.4.0，proto文件需要加上go_package，否则无法生成
option go_package = "./login";

message LoginReq {
  string username = 1;
  string password = 2;
  CaptchaReq captcha = 3;
  string ip = 4;
  string env = 5;  // 环境，开发环境 or 测试环境 etc
}

message LoginResp {
  string username = 1;
  string accessToken = 2;
  string refreshToken = 3;
  string userLevel = 4;
  string realName = 5;
  string country = 6;
  string avatar = 7;
  string promotionCode = 8;
  int64 id = 9;
  int32 loginCount = 10;
  string superPartner = 11;
  int32 userRate = 12;
}

message CaptchaReq {
  string server = 1;
  string token = 2;
}

service Login {
  rpc Login(LoginReq) returns(LoginResp);
}